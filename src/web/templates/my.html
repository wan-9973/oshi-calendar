{% extends "base.html" %}
{% block title %}マイ推しリスト - {{ site_name }}{% endblock %}
{% block content %}
<section id="my-calendar" class="content-section my-calendar" hidden aria-busy="true">
  <h2 class="section-title">みんなの供給をひとつに</h2>
  <div class="calendar-toolbar my-calendar-toolbar">
    <nav class="month-nav" aria-label="統合カレンダーの表示月">
      <button id="my-calendar-prev" class="month-button" type="button">← <span>前の供給月</span></button>
      <h2 id="my-calendar-month">読み込み中</h2>
      <button id="my-calendar-next" class="month-button" type="button"><span>次の供給月</span> →</button>
    </nav>
  </div>
  <div id="my-calendar-loading" class="skeleton-grid" aria-hidden="true">
    {% for _ in range(4) %}<div class="skeleton-card"><div class="skeleton-image"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>{% endfor %}
  </div>
  <p id="my-calendar-note" class="note" role="status" aria-live="polite"></p>
  <div id="my-calendar-timeline" class="timeline"></div>
</section>

<section class="content-section">
  <h2 class="section-title">登録中の推し</h2>
  <div id="my-list" class="my-list"><div class="empty-state"><span class="empty-illustration" aria-hidden="true">💗</span><h2>まだ推しが登録されていません</h2><p>推しページの「☆ マイ推しリストに追加」から登録できます。</p><a class="primary-link" href="/">推しを検索する</a></div></div>
</section>
{% endblock %}
